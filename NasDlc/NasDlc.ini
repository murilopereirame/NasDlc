; NasDlc settings
; Put this file in the root of the USB drive, next to launch.ini.
; Lines that start with ; are comments. A missing setting keeps its default.

[Paths]
; HDD content folder, as XAM sees it. Normally no change is necessary.
HddContent = \Device\Harddisk0\Partition1\Content\
; NAS content folder, as XAM sees it (ConnectX share).
; Format: \Network\Smb\<server>\<share>\Content\
NasContent = \Network\Smb\DOCKER\XBOXSMB\Content\

[Content]
; 1 = load DLC (00000002) from the NAS when it is not on the HDD
Dlc = 1
; 1 = load title updates (000B0000) from the NAS when they are not on the HDD
TitleUpdates = 1

[Notify]
; 1 = show "NasDlc active" at boot and "NAS connected" when the NAS is available
Start = 1
; 1 = show "NAS: N DLC packages found" and "NAS: title update loaded"
Found = 1

[Log]
; Log file: NasDlc.log in the root of this USB drive
; 0 = no log, 1 = important lines, 2 = all details (for problems)
Level = 1
; 1 = log each title update search of XAM (diagnostic)
TuTrace = 0
; 1 = log each XAM access to a \Content\ path, on all devices (diagnostic)
ContentTrace = 0

[Cache]
; 1 = keep the start of each NAS package in memory (faster DLC load)
Enabled = 1
; 1 = diagnostic mode: read from the NAS and compare with the cache (slower)
Verify = 0

[Speed]
; 1 = worker threads fill the cache of each NAS DLC package before XAM opens it
; (test feature, needs Cache Enabled = 1)
Prefetch = 0
; Number of worker threads for the prefetch (1 to 4)
PrefetchThreads = 2
