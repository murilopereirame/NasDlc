; NasDlc settings. Copy this file to the root of the first USB drive.
; All settings are optional. A missing setting keeps its default value.
; Boolean values: 1/0, true/false, yes/no, on/off.

[Paths]
; HDD content folder, as XAM sees it.
HddContent = \Device\Harddisk0\Partition1\Content\
; NAS content folder: \Network\Smb\<server>\<share>\Content\
NasContent = \Network\Smb\DOCKER\XBOXSMB\Content\

[Content]
Dlc = 1
TitleUpdates = 1

[Notify]
Start = 1
Found = 1

[Log]
; 0 = no log, 1 = important lines, 2 = all details
Level = 1
TuTrace = 0

[Cache]
Enabled = 1
Verify = 0
